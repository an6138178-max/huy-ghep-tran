name: Build iOS Tweak

on: [push]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: unforgiven-dev/install-theos-action@v1

      - name: Build Package
        run: make package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dylib-file
          path: .theos/_/*.dylib
